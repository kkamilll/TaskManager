services:
  backend:
    build: ./backend
    container_name: task-manager-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    networks:
      - task-network

  frontend:
    build: ./frontend/Task-manager
    container_name: task-manager-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/Task-manager:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - task-network

networks:
  task-network:
    driver: bridge
